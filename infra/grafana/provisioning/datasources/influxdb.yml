# influxdb.yml
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: jmeter
    user: ""
    password: ""
    basicAuth: false
    isDefault: true
    jsonData:
      httpMode: POST
      timeInterval: "1s"
      keepCookies: false
      tlsSkipVerify: false
      tlsAuth: false
      tlsAuthWithCACert: false
      version: "InfluxQL"