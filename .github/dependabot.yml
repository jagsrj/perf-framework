version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /jmeter
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /agent
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
